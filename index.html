"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Flight Simulation System</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            margin: 0;\n            padding: 0;\n            background-color: #f0f0f0;\n        }\n        .container {\n            max-width: 800px;\n            margin: 0 auto;\n            padding: 20px;\n            background-color: white;\n            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);\n        }\n        h1 {\n            text-align: center;\n            color: #333;\n        }\n        .simulation-area {\n            height: 400px;\n            background-color: #000;\n            margin: 20px 0;\n            position: relative;\n            overflow: hidden;\n        }\n        .controls {\n            display: flex;\n            justify-content: center;\n            gap: 10px;\n            margin: 20px 0;\n        }\n        button {\n            padding: 10px 20px;\n            font-size: 16px;\n            cursor: pointer;\n        }\n        .info {\n            margin-top: 20px;\n            padding: 10px;\n            background-color: #f9f9f9;\n            border: 1px solid #ddd;\n        }\n    </style>\n</head>\n<body>\n    <div class=\"container\">\n        <h1>Flight Simulation System</h1>\n        <div class=\"simulation-area\" id=\"simulationArea\">\n            <!-- Simulation will be rendered here -->\n        </div>\n        <div class=\"controls\">\n            <button id=\"startBtn\">Start Simulation</button>\n            <button id=\"pauseBtn\">Pause Simulation</button>\n            <button id=\"resetBtn\">Reset Simulation</button>\n        </div>\n        <div class=\"info\" id=\"info\">\n            <p>Status: Ready</p>\n            <p>Altitude: 0 ft</p>\n            <p>Speed: 0 mph</p>\n        </div>\n    </div>\n    <script>\n        // JavaScript for the Flight Simulation System\n        document.getElementById('startBtn').addEventListener('click', function() {\n            document.getElementById('info').innerHTML = '<p>Status: Running</p><p>Altitude: 1000 ft</p><p>Speed: 200 mph</p>';\n        });\n        document.getElementById('pauseBtn').addEventListener('click', function() {\n            document.getElementById('info').innerHTML = '<p>Status: Paused</p><p>Altitude: 1000 ft</p><p>Speed: 200 mph</p>';\n        });\n        document.getElementById('resetBtn').addEventListener('click', function() {\n            document.getElementById('info').innerHTML = '<p>Status: Ready</p><p>Altitude: 0 ft</p><p>Speed: 0 mph</p>';\n        });\n    </script>\n</body>\n</html>"
